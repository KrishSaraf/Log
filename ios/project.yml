name: Log
options:
  bundleIdPrefix: com.krishsaraf
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Log:
    type: application
    platform: iOS
    sources:
      - path: Log
        excludes:
          - "Resources/**"
          - "Info.plist"
          - "Log.entitlements"
      - path: Log/Resources
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.krishsaraf.log
      PRODUCT_NAME: Log
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_FILE: Log/Info.plist
      CODE_SIGN_ENTITLEMENTS: Log/Log.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 5Y3HC4LWAC
      ENABLE_DEBUG_DYLIB: false
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    entitlements:
      path: Log/Log.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
